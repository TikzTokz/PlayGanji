services:
  ganji:
    build:
      context: .
      dockerfile: Dockerfile
    image: playganji:latest
    network_mode: host
    environment:
      PORT: "3001"
      LISTEN_ADDRS: "127.0.0.1:3001,[::1]:3001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3001/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

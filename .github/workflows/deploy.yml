name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.11'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Dependency audit
        run: bun audit

      - name: Frontend tests
        run: bun run test

      - name: Go tests
        run: go test ./cmd/... ./internal/...

      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        run: bun run build

      - name: Go build
        run: go build -o /tmp/ganji-server ./cmd/server

  deploy:
    name: Deploy
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy with Docker Compose
        working-directory: /opt/PlayGanji
        env:
          XDG_RUNTIME_DIR: /run/user/1002
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1002/bus
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -ffdx
          docker image inspect playganji:latest > /dev/null 2>&1 && docker tag playganji:latest playganji:previous || true
          systemctl --user disable --now playganji.service || true
          docker compose up -d --build --force-recreate
          docker compose ps

      - name: Health check
        env:
          PUBLIC_HEALTH_URL: ${{ vars.PUBLIC_HEALTH_URL || 'https://kingbruno.playganji.online/health' }}
          XDG_RUNTIME_DIR: /run/user/1002
          DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1002/bus
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/health > /dev/null; then
              break
            fi

            if [ "$attempt" = "10" ]; then
              cd /opt/PlayGanji
              if docker image inspect playganji:previous > /dev/null 2>&1; then
                docker tag playganji:previous playganji:latest
                docker compose up -d --force-recreate
              fi

              curl --fail --show-error http://127.0.0.1:3001/health
            fi

            sleep 3
          done

          curl --fail --silent --show-error 'http://[::1]:3001/health' > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$PUBLIC_HEALTH_URL" > /dev/null

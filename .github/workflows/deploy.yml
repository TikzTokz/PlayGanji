name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.10'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Dependency audit
        run: bun audit

      - name: Frontend tests
        run: bun run test

      - name: Go tests
        run: go test ./cmd/... ./internal/...

      - name: Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build
        run: bun run build

      - name: Go build
        run: go build -o /tmp/ganji-server ./cmd/server

  deploy:
    name: Deploy
    needs: ci
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy with Docker Compose
        working-directory: /opt/PlayGanji
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -ffdx
          docker image inspect playganji:latest > /dev/null 2>&1 && docker tag playganji:latest playganji:previous || true
          docker compose up -d --build
          docker compose ps

      - name: Health check
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3001/health > /dev/null; then
              exit 0
            fi

            sleep 3
          done

          cd /opt/PlayGanji
          if docker image inspect playganji:previous > /dev/null 2>&1; then
            docker tag playganji:previous playganji:latest
            docker compose up -d
          fi

          curl --fail http://127.0.0.1:3001/health
